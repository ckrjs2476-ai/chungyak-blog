# 전세 온도계 데이터: 한국 시간 매일 05:40, 15:40
name: jeonse-data
on:
  schedule:
    - cron: "40 20 * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python blogs/jeonse/data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 저장
        run: |
          git config user.name "jeonse-bot"
          git config user.email "jeonse-bot@users.noreply.github.com"
          git add -A blogs/jeonse/data
          git diff --cached --quiet || git commit -m "jeonse data $(date -u +%F)"
          git pull --rebase && git push
