# 새 블로그용 데이터 API 시험 호출 (수동 실행)
name: probe-apis
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/probe.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
