# 새 블로그용 데이터 API 시험 호출 (수동 실행)
name: probe-apis
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/probe.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
      - name: 결과 저장
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add data/probe.txt
          git commit -m "probe results" || exit 0
          git pull --rebase && git push
