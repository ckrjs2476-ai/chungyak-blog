# 키워드 사다리: 매주 월·목 05:10 KST, 블로그별 '지금 쓸 키워드' 갱신
name: keywords
on:
  schedule:
    - cron: "10 20 * * 0,3"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml markdown
      - run: python src/keywords.py
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      - name: 저장
        run: |
          git config user.name "keywords-bot"
          git config user.email "keywords-bot@users.noreply.github.com"
          git add data/keywords data/keyword_stage.json
          git diff --cached --quiet && exit 0
          git commit -m "keywords $(date -u +%F)"
          git pull --rebase && git push
