# 드론 정보노트 키워드 조사 (수동 + 매주 월 05:20 KST)
name: drone-keywords
on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 * * 0"
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  kw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/kw_drone.py
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      - name: 저장
        run: |
          git config user.name "keywords-bot"
          git config user.email "keywords-bot@users.noreply.github.com"
          git add blogs/drone/data/keywords.json blogs/drone/data/keywords.md
          git diff --cached --quiet && exit 0
          git commit -m "drone keywords $(date -u +%F)"
          git pull --rebase && git push
