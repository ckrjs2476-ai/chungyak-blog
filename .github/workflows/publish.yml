# 새 글이 posts/pending/에 올라오면 검수 후 Blogger에 올린다
name: publish-posts
on:
  push:
    paths:
      - "posts/pending/**"
  workflow_dispatch:
    inputs:
      task:
        description: "rerender = 이미 올린 글 본문 다시 만들기, publish-drafts = 임시저장 글 공개, pages = 고정 페이지 올리기, 비우면 새 글 발행"
        default: ""
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests markdown pyyaml
      - name: 검수와 발행
        id: run
        run: python src/publish.py ${{ github.event.inputs.task && format('--{0}', github.event.inputs.task) || '' }}
        continue-on-error: true
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      - name: 기록 저장
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A posts data
          git diff --cached --quiet || git commit -m "publish: $(date -u +%F)"
          git pull --rebase && git push
      - name: 보류된 글이 있으면 실패로 표시 (알림 메일)
        if: steps.run.outcome == 'failure'
        run: exit 1
