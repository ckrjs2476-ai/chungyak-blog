# 애드센스 거절 사유 상위 항목 공개 화면 점검: 매일 09:40 KST
name: sitecheck
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests markdown pyyaml
      - run: python src/sitecheck.py
      - name: 4개 블로그 audit
        run: |
          python src/audit.py
          for k in jeonse gongmoju gwanribi; do BLOG_KEY=$k python src/audit.py; done
      - name: 가치(거절 사유 1위) 분석
        run: python src/value.py
      - name: 애드센스 신청 준비 상태
        run: python src/readiness.py
      - name: 저장
        run: |
          git config user.name "sitecheck-bot"
          git config user.email "sitecheck-bot@users.noreply.github.com"
          git add data/sitecheck.md data/sitecheck.json data/audit.md blogs/*/data/audit.md data/value_report.md data/value_brief.md blogs/*/data/value_brief.md data/readiness.md
          git diff --cached --quiet && exit 0
          git commit -m "sitecheck $(date -u +%F)"
          git pull --rebase && git push
