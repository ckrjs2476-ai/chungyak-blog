# 검색엔진 등록 흔적 점검 (수동 실행)
name: regcheck
on:
  workflow_dispatch:
    inputs:
      blogs:
        default: ""
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/regcheck.py ${{ github.event.inputs.blogs }}
