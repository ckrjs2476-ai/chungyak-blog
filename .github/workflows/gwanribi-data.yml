# 관리비 돋보기 데이터: 한국 시간 매일 04:20, 14:20 (한 번에 시군구 1곳)
name: gwanribi-data
on:
  schedule:
    - cron: "20 19 * * *"
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      lawd:
        description: "특정 시군구 코드만 (비우면 순서대로)"
        default: ""
permissions:
  contents: write
concurrency:
  group: gwanribi-data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python blogs/gwanribi/data.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          GWANRIBI_LAWD: ${{ github.event.inputs.lawd }}
      - name: 저장
        run: |
          git config user.name "gwanribi-bot"
          git config user.email "gwanribi-bot@users.noreply.github.com"
          git add -A blogs/gwanribi/data
          git diff --cached --quiet && exit 0
          git commit -m "gwanribi data $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
