# 공개 페이지 화면 캡처: captures/queue.json을 바꿔 push하면 실행
name: capture
on:
  workflow_dispatch:
  push:
    paths: ["captures/queue.json"]
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y fonts-noto-cjk
      - run: python tools/capture.py
      - name: 저장
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A captures
          git diff --cached --quiet || git commit -m "capture $(date -u +%F)"
          git pull --rebase && git push
