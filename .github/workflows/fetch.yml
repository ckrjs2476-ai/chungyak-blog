# 청약홈 데이터 받기: 한국 시간 매일 07:20, 18:20 (UTC 22:20, 09:20)
name: fetch-data
on:
  schedule:
    - cron: "20 22 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/fetch.py 30
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 저장
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 청약홈 데이터"
          git pull --rebase && git push
