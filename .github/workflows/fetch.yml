# 청약홈 데이터 받기: 한국 시간 매일 07:20, 18:20 (UTC 22:20, 09:20)
name: fetch-data
on:
  schedule:
    - cron: "20 22 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전 공고까지 받을지 (처음 한 번은 400으로 과거 데이터 받기)"
        default: "30"
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/fetch.py ${{ github.event.inputs.days || '30' }}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: python src/search_volume.py
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
      - run: python src/market.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: python src/analysis.py
      - name: 공고 글에 경쟁률·당첨 가점 결과 이어 붙이기
        continue-on-error: true
        run: |
          pip install markdown pyyaml
          python src/publish.py --results
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: 저장
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) 청약홈 데이터"
          git pull --rebase && git push
